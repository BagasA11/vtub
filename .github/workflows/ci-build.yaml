on:
    push:
        branches:
            main
    pull_request:
        branches:
            main
        
jobs:
    build:
        runs-on: ubuntu-latest
        container: node:27.0.0-alpha.0.1.0-alpine3.24
    
        steps:
            - name: checkout
              uses: actions/checkout@v2

            - name: install-dependencis
              run: npm install
            
            - name: run-unit-testing-with-jest
              run: npm test
